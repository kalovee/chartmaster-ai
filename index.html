  })).filter(s => s.count > 0);
  window._menuWrong = wrongList;

  app.innerHTML = `
    <div class="menu-header">
      <div class="menu-kicker">畢業考衝刺練習</div>
      <h1>英語教育系互動測驗</h1>
      <p>把各科重點變成可以立刻練的題庫。先選一科暖身，也可以直接進入全科綜合測驗。</p>
      <div class="menu-stats">
        <span class="stat-pill">9 科目</span>
        <span class="stat-pill">${totalQuestions} 題題庫</span>
        <span class="stat-pill">${wrongCount > 0 ? `${wrongCount} 題錯題待複習` : '錯題本目前清空'}</span>
      </div>
      <div class="top-actions">
        <button class="mode-btn" onclick="toggleFeedbackMode()">詳解模式：${settings.feedbackTiming === "end" ? "結束後統一看" : "答完立即看"}</button>
        <button class="mode-btn" onclick="toggleTheme()">${settings.theme === "dark" ? "切換淺色模式" : "切換深色模式"}</button>
      </div>
    </div>

    <div class="dashboard-grid">
      <div class="dash-card">
        <div class="dash-label">練習次數</div>
        <div class="dash-value">${stats.sessions}</div>
        <div class="dash-note">完成測驗才會累計</div>
      </div>
      <div class="dash-card">
        <div class="dash-label">總正確率</div>
        <div class="dash-value">${stats.answered ? `${accuracy}%` : "—"}</div>
        <div class="dash-note">${stats.answered} 題作答紀錄</div>
      </div>
      <div class="dash-card">
        <div class="dash-label">最近一次</div>
        <div class="dash-value">${stats.lastScore ? `${stats.lastScore.pct}%` : "—"}</div>
        <div class="dash-note">${stats.lastScore ? stats.lastScore.label : "還沒有紀錄"}</div>
      </div>
      <div class="dash-card">
        <div class="dash-label">最弱科目</div>
        <div class="dash-value">${weakest ? `${Math.round((weakest.correct / weakest.answered) * 100)}%` : "—"}</div>
        <div class="dash-note">${weakest ? weakest.name : "至少每科答 3 題後顯示"}</div>
      </div>
    </div>

    <div class="tools-grid">
      <div class="tool-panel">
        <div class="tool-title"><span>搜尋題庫</span><span style="color:var(--muted);font-size:.78rem">${totalQuestions} 題</span></div>
        <div class="search-row">
          <input class="search-input" id="search-input" placeholder="輸入關鍵字：Krashen、CLT、phoneme..." oninput="renderSearchResults()">
          <button class="mini-btn" onclick="startSearchFromInput()">練搜尋結果</button>
        </div>
        <div class="search-results" id="search-results">
          <div class="dash-note">輸入關鍵字後會列出相關題目，可以直接點單題，也可以把搜尋結果變成一組測驗。</div>
        </div>
      </div>
      <div class="tool-panel">
        <div class="tool-title"><span>錯題本</span><span style="color:var(--muted);font-size:.78rem">${wrongCount} 題</span></div>
        <div class="dash-note">${wrongCount ? "依科目分類練習；答對會自動移除，也可手動標記已熟。" : "目前沒有錯題，先去練一輪吧。"}</div>
        <div class="result-actions-inline">
          ${wrongCount ? `<button class="mini-btn" onclick="startWrongReview()">練全部錯題</button><button class="mini-btn" onclick="if(confirm('確定清除所有錯題記錄？')){clearAllWrong();renderMenu();}">清除錯題</button>` : ""}
        </div>
        <div class="wrong-groups">
          ${wrongBySubject.map(s => `<button class="wrong-chip" onclick="startWrongReview('${s.id}')">${s.name} · ${s.count} 題${s.maxWrong > 1 ? ` · 最多錯 ${s.maxWrong} 次` : ""}</button>`).join("")}
        </div>
        <div class="wrong-preview">
          ${wrongList.slice(0, 5).map((w, i) => `
            <div class="wrong-row">
              <span><b>${w._subject}</b> · 錯 ${w.wrongCount || 1} 次<br>${w.q}</span>
              <button class="mini-btn" onclick="markMasteredByMenuIndex(${i})">已熟</button>
            </div>
          `).join("")}
        </div>
      </div>
    </div>

    <div class="quick-grid">
      <div class="subject-card" style="--accent:#e11d48" onclick="startComprehensive()">
        <span class="emoji">🎯</span>
        <h2>全科綜合測驗</h2>
        <div class="en">All Subjects Mixed</div>
        <div class="count">📝 隨機抽 50 題</div>
      </div>
      <div class="subject-card ${wrongCount === 0 ? 'disabled-card' : ''}" style="--accent:#dc7b00" onclick="${wrongCount > 0 ? 'startWrongReview()' : ''}">
        <span class="emoji">🔁</span>
        <h2>複習錯題</h2>
        <div class="en">Wrong Question Review</div>
        <div class="count">${wrongCount > 0 ? `❌ ${wrongCount} 題待複習` : '✅ 目前沒有錯題'}</div>
        ${wrongCount > 0 ? `<div class="clear-record" onclick="event.stopPropagation();if(confirm('確定清除所有錯題記錄？')){clearAllWrong();renderMenu();}">🗑 清除記錄</div>` : ''}
      </div>
    </div>

    <div class="section-label">Subject Practice</div>
    <div class="subjects">
      ${SUBJECTS.map(s => {
        const qs = QUESTIONS[s.id] || [];
        return `
          <div class="subject-card" style="--accent:${s.color}" onclick="startQuiz('${s.id}')">
            <span class="emoji">${s.emoji}</span>
            <h2>${s.name}</h2>
            <div class="en">${s.en}</div>
            <div class="count">📝 ${qs.length} 題</div>
          </div>
        `;
      }).join("")}
    </div>
  `;
}

function startQuiz(subjectId) {
  isReviewMode = false;
  isComprehensive = false;
  isSearchMode = false;
  currentSubject = SUBJECTS.find(s => s.id === subjectId);
  questions = shuffle([...(QUESTIONS[subjectId] || [])].map((q, idx) => hardenQuestion(q, currentSubject.id, currentSubject.name, idx)));
  resetSession();
  renderQuestion();
}

function startComprehensive() {
  isReviewMode = false;
  isComprehensive = true;
  isSearchMode = false;
  currentSubject = { name: "全科綜合測驗", en: "All Subjects", emoji: "🎯", color: "#e11d48" };
  const allQ = [];
  SUBJECTS.forEach(s => {
    const qs = QUESTIONS[s.id] || [];
    const picked = shuffle([...qs]).slice(0, Math.ceil(50 / SUBJECTS.length) + 1);
    picked.forEach(q => {
      const originalIdx = qs.indexOf(q);
      allQ.push(hardenQuestion(q, s.id, s.name, originalIdx));
    });
  });
  questions = shuffle(allQ).slice(0, 50);
  resetSession();
  renderQuestion();
}

function resetSession() {
  current = 0;
  score = 0;
  sessionWrong = [];
  answerLog = [];
  answered = false;
  sessionSaved = false;
  feedbackTiming = loadSettings().feedbackTiming || "immediate";
}

function restartCurrentSet() {
  questions = shuffle([...questions]);
  resetSession();
  renderQuestion();
}

function startWrongReview(subjectId = null) {
  const wrongList = activeWrong(subjectId);
  if (!wrongList.length) return;
  isReviewMode = true;
  isComprehensive = false;
  isSearchMode = false;
  const subject = SUBJECTS.find(s => s.id === subjectId);
  currentSubject = { name: subject ? `複習錯題：${subject.name}` : "複習錯題", en: "Wrong Question Review", emoji: "🔁", color: "#dc7b00" };
  questions = shuffle([...wrongList]);
  resetSession();
  renderQuestion();
}

function renderSearchResults() {
  const input = document.getElementById("search-input");
  const box = document.getElementById("search-results");
  if (!input || !box) return;
  const query = input.value.trim().toLowerCase();
  if (!query) {
    box.innerHTML = `<div class="dash-note">輸入關鍵字後會列出相關題目，可以直接點單題，也可以把搜尋結果變成一組測驗。</div>`;
    return;
  }
  const matches = SEARCH_INDEX.filter(item => `${item._subject} ${item.q} ${item.opts.join(" ")} ${item.exp}`.toLowerCase().includes(query));
  box.innerHTML = matches.length ? matches.slice(0, 20).map(item => `
    <div class="result-item" onclick="startSingleSearchQuestion('${item._index}')">
      <strong>${item._subject}</strong>
      <span>${item.q}</span>
    </div>
  `).join("") + (matches.length > 20 ? `<div class="dash-note">還有 ${matches.length - 20} 題，按「練搜尋結果」會全部加入。</div>` : "") : `<div class="dash-note">找不到相關題目，換個關鍵字試試。</div>`;
}

function getSearchMatches(query) {
  const q = query.trim().toLowerCase();
  if (!q) return [];
  return SEARCH_INDEX.filter(item => `${item._subject} ${item.q} ${item.opts.join(" ")} ${item.exp}`.toLowerCase().includes(q));
}

function startSearchFromInput() {
  const input = document.getElementById("search-input");
  const query = input?.value || "";
  const matches = getSearchMatches(query);
  if (!matches.length) return;
  isReviewMode = false;
  isComprehensive = false;
  isSearchMode = true;
  currentSubject = { name: `搜尋：${query.trim()}`, en: "Search Practice", emoji: "🔎", color: "#2f6f73" };
  questions = shuffle(matches.map(item => ({ ...item })));
  resetSession();
  renderQuestion();
}

function startSingleSearchQuestion(index) {
  const item = SEARCH_INDEX.find(x => x._index === index);
  if (!item) return;
  isReviewMode = false;
  isComprehensive = false;
  isSearchMode = true;
  currentSubject = { name: `單題搜尋：${item._subject}`, en: "Single Question", emoji: "🔎", color: "#2f6f73" };
  questions = [{ ...item }];
  resetSession();
  renderQuestion();
}

function renderQuestion() {
  document.body.classList.add("quiz-active");
  const app = document.getElementById("app");
  const q = questions[current];
  const pct = Math.round((current / questions.length) * 100);

  app.innerHTML = `
    <div class="quiz-header">
      <button class="back-btn" onclick="renderMenu()">← 返回選單</button>
      <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
      <div class="progress-text">
        <span>${currentSubject.name}</span>
        <span>${current + 1} / ${questions.length}</span>
      </div>
    </div>
    <div class="question-card">
      <div class="q-meta">第 ${current + 1} 題${(isComprehensive || isReviewMode) && q._subject ? ` · <span style="color:var(--primary)">${q._subject}</span>` : ''}</div>
      <div class="q-text">${q.q}</div>
      <div class="options" id="opts">
        ${q.opts.map((opt, i) => `
          <div class="option" id="opt-${i}" onclick="selectAnswer(${i})">
            <span class="opt-label">${String.fromCharCode(65+i)}</span>
            <span>${opt}</span>
          </div>
        `).join("")}
      </div>
      <div class="feedback" id="feedback"></div>
      <button class="next-btn" id="next-btn" onclick="nextQuestion()">
        ${current === questions.length - 1 ? "查看結果 →" : "下一題 →"}
      </button>
    </div>
  `;
}

function selectAnswer(idx) {
  if (answered) return;
  answered = true;
  const q = questions[current];
  const correct = idx === q.ans;
  const subjectId = q._subjectId || currentSubject.id || "mixed";
  const subjectName = q._subject || currentSubject.name;
  answerLog.push({ q, selected: idx, correct, subjectId, subjectName });

  const opts = document.querySelectorAll(".option");
  const fb = document.getElementById("feedback");
  const nextBtn = document.getElementById("next-btn");

  opts.forEach(o => { o.classList.add("disabled"); o.style.pointerEvents = "none"; });
  if (feedbackTiming === "immediate" && opts[q.ans]) opts[q.ans].classList.add("show-correct");

  if (correct) {
    score++;
    if (opts[idx]) opts[idx].classList.add("correct");
    if (fb && feedbackTiming === "immediate") {
      fb.className = "feedback correct-fb show";
      fb.innerHTML = `<span class="feedback-icon">✅</span> 正確！${q.exp}`;
    }
    removeFromWrong(q);
  } else {
    if (opts[idx]) opts[idx].classList.add("wrong");
    if (fb && feedbackTiming === "immediate") {
      fb.className = "feedback wrong-fb show";
      fb.innerHTML = `<span class="feedback-icon">❌</span> 答案是 <strong>${String.fromCharCode(65+q.ans)}</strong>。${q.exp}`;
    }
    addWrong(q, subjectName);
    sessionWrong.push(q);
  }
  if (fb && feedbackTiming === "end") {
    fb.className = "feedback correct-fb show";
    fb.innerHTML = `<span class="feedback-icon">📝</span> 已作答。你選的是 <strong>${String.fromCharCode(65+idx)}</strong>，詳解會在結果頁一起顯示。`;
  }

  // 保底：一定要顯示下一題按鈕
  if (nextBtn) {
    nextBtn.classList.add("show");
    nextBtn.style.display = "block";
  }
}

function nextQuestion() {
  current++;
  answered = false;
  if (current >= questions.length) {
    renderResult();
  } else {
    renderQuestion();
  }
}

function renderResult() {
  document.body.classList.remove("quiz-active");
  recordSessionStats();
  const app = document.getElementById("app");
  const pct = Math.round((score / questions.length) * 100);
  let grade, emoji;
  if (pct >= 90) { grade = "優秀！畢業考一定過！"; emoji = "🏆"; }
  else if (pct >= 75) { grade = "很好，再複習一下弱項！"; emoji = "🎯"; }
  else if (pct >= 60) { grade = "及格了，繼續加油！"; emoji = "💪"; }
  else { grade = "需要多加複習，你可以的！"; emoji = "📖"; }

  const totalWrong = loadWrong().length;
  const retryBtn = isReviewMode
    ? `<button class="btn-retry" onclick="startWrongReview()">🔄 再練錯題</button>`
    : isComprehensive
      ? `<button class="btn-retry" onclick="startComprehensive()">🔄 再來一輪</button>`
      : isSearchMode
        ? `<button class="btn-retry" onclick="restartCurrentSet()">🔄 再練這組</button>`
        : `<button class="btn-retry" onclick="startQuiz(currentSubject.id)">🔄 再練一次</button>`;

  const wrongBanner = sessionWrong.length > 0 ? `
    <div style="margin:16px 0;padding:12px 16px;background:#fff7ed;border:1px solid #fed7aa;border-radius:10px;font-size:0.88rem;color:#92400e">
      ❌ 本次答錯 <strong>${sessionWrong.length}</strong> 題，已自動加入錯題本（共 ${totalWrong} 題）
    </div>` : isReviewMode && sessionWrong.length === 0 ? `
    <div style="margin:16px 0;padding:12px 16px;background:#ecfdf5;border:1px solid #6ee7b7;border-radius:10px;font-size:0.88rem;color:#065f46">
      🎉 錯題全部答對！已從錯題本移除。
    </div>` : '';
  const endReview = feedbackTiming === "end" ? `
    <div class="review-strip">
      ${answerLog.map((item, i) => `
        <div class="review-card ${item.correct ? 'correct-review' : 'wrong-review'}">
          <span class="tag">${item.subjectName || currentSubject.name} · 第 ${i + 1} 題 · ${item.correct ? '答對' : '答錯'}</span>
          <div><strong>題目：</strong>${item.q.q}</div>
          <div><strong>你的答案：</strong>${String.fromCharCode(65 + item.selected)}. ${item.q.opts[item.selected]}</div>
          <div><strong>正確答案：</strong>${String.fromCharCode(65 + item.q.ans)}. ${item.q.opts[item.q.ans]}</div>
          <div><strong>詳解：</strong>${item.q.exp}</div>
          ${!item.correct ? `<button class="mini-btn" style="margin-top:8px" onclick="markMastered('${item.q.q.replace(/'/g, "\\'")}')">標記已熟</button>` : ""}
        </div>
      `).join("")}
    </div>
  ` : "";

  app.innerHTML = `
    <div class="quiz-header">
      <button class="back-btn" onclick="renderMenu()">← 返回選單</button>
    </div>
    <div class="result-card">
      <div style="font-size:3rem;margin-bottom:12px">${emoji}</div>
      <div class="result-score">${pct}%</div>
      <div class="result-label">${score} / ${questions.length} 題答對</div>
      <div class="result-grade">${grade}</div>
      ${wrongBanner}
      ${endReview}
      <div class="result-actions">
        ${retryBtn}
        ${activeWrong().length > 0 && !isReviewMode ? `<button class="btn-menu" style="border-color:#dc7b00;color:#dc7b00" onclick="startWrongReview()">🔁 複習錯題（${activeWrong().length}）</button>` : ''}
        <button class="btn-menu" onclick="renderMenu()">🏠 選擇科目</button>
      </div>
    </div>
  `;
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

// Init
saveSettings(loadSettings());
renderMenu();
if ("serviceWorker" in navigator && location.protocol !== "file:") {
  navigator.serviceWorker.register("./sw.js").catch(() => {});
}
</script>
</body>
</html>
